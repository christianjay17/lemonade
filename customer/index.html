<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemonade Stand — Order Lookup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fffbf2; min-height: 100vh; }
  .header { background: #EF9F27; padding: 1rem 1.25rem; display: flex; align-items: center; gap: 12px; }
  .header-emoji { font-size: 26px; }
  .header-title { font-size: 19px; font-weight: 600; color: #412402; }
  .header-sub { font-size: 12px; color: #633806; }
  .container { max-width: 480px; margin: 0.875rem auto; padding: 0 0.75rem 2rem; }
  .card { background: #fff; border: 1px solid #e8e0d0; border-radius: 12px; padding: 1rem; margin-bottom: 0.875rem; }
  .section-label { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .code-input { width: 100%; height: 68px; border-radius: 10px; border: 1px solid #e8e0d0; background: #fff; color: #1a1a1a; text-align: center; font-size: clamp(28px, 10vw, 36px); font-weight: 700; letter-spacing: 0.25em; font-family: 'Courier New', monospace; padding: 0 12px; margin-bottom: 12px; -webkit-appearance: none; }
  .code-input:focus { outline: none; border-color: #EF9F27; box-shadow: 0 0 0 3px rgba(239,159,39,0.15); }
  .lookup-btn { width: 100%; padding: 15px; border-radius: 8px; border: none; background: #EF9F27; color: #412402; font-size: 16px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .lookup-btn:active { background: #FAC775; }
  .lookup-btn:disabled { opacity: 0.4; }
  .error-msg { font-size: 14px; color: #c0392b; margin-top: 10px; text-align: center; display: none; }
  .order-row { display: flex; justify-content: space-between; font-size: 15px; color: #444; padding: 7px 0; border-bottom: 1px solid #f0ebe0; }
  .order-row:last-of-type { border-bottom: none; }
  .order-total-row { display: flex; justify-content: space-between; font-size: 16px; font-weight: 600; color: #1a1a1a; padding-top: 10px; margin-top: 6px; border-top: 1px solid #e8e0d0; }
  .payment-banner { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-radius: 8px; margin-top: 12px; font-size: 14px; font-weight: 500; }
  .banner-cash { background: #EAF3DE; color: #3B6D11; }
  .banner-venmo { background: #E6F1FB; color: #185FA5; }
  .pay-btn { width: 100%; padding: 15px; border-radius: 8px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; -webkit-tap-highlight-color: transparent; }
  .pay-btn-venmo { background: #3D95CE; color: #fff; }
  .pay-btn-venmo:active { background: #2d7aad; }
  .success-box { text-align: center; padding: 2rem 1rem; }
  .success-big { font-size: 52px; margin-bottom: 12px; }
  .success-box h2 { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
  .success-box p { font-size: 15px; color: #666; line-height: 1.5; }
  .another-btn { margin-top: 1.5rem; padding: 12px 28px; border-radius: 8px; border: 1px solid #ddd; background: #fff; font-size: 15px; color: #333; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .another-btn:active { background: #f5f5f5; }
  #loadingView, #orderView, #tipView, #successView { display: none; }
  .banner-other { background: #f5f0e6; color: #633806; }
  .loading-card { text-align: center; padding: 2rem 1rem; color: #888; font-size: 15px; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #FAEEDA; border-top-color: #EF9F27; margin: 0 auto 12px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ── TIP ── */
  .tip-header { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
  .tip-sub { font-size: 13px; color: #888; margin-bottom: 16px; }
  .tip-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .tip-preset { border: 1px solid #e8e0d0; border-radius: 8px; padding: 12px 4px; cursor: pointer; text-align: center; background: #fff; font-size: 15px; font-weight: 500; color: #1a1a1a; -webkit-tap-highlight-color: transparent; }
  .tip-preset:active { background: #fffbf2; }
  .tip-preset.selected { border: 2px solid #EF9F27; background: #FAEEDA; color: #412402; font-weight: 600; }
  .tip-preset .tip-pct { font-size: 15px; font-weight: 600; }
  .tip-preset .tip-amt { font-size: 11px; color: #888; margin-top: 2px; }
  .tip-preset.selected .tip-amt { color: #854F0B; }
  .tip-custom-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .tip-custom-input { flex: 1; height: 46px; border-radius: 8px; border: 1px solid #e8e0d0; background: #fff; color: #1a1a1a; padding: 0 12px; font-size: 16px; font-family: inherit; }
  .tip-custom-input:focus { outline: none; border-color: #EF9F27; box-shadow: 0 0 0 2px rgba(239,159,39,0.15); }
  .tip-custom-input::placeholder { color: #bbb; }
  .tip-lbl { font-size: 14px; color: #888; white-space: nowrap; }
  .tip-total-row { display: flex; justify-content: space-between; font-size: 16px; font-weight: 600; color: #1a1a1a; padding: 12px 0 16px; border-top: 1px solid #f0ebe0; }
  .tip-pay-btn { width: 100%; padding: 15px; border-radius: 8px; border: none; background: #3D95CE; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .tip-pay-btn:active { background: #2d7aad; }
  .tip-skip { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #e8e0d0; background: #fff; color: #888; font-size: 14px; cursor: pointer; margin-top: 8px; -webkit-tap-highlight-color: transparent; }
  .tip-skip:active { background: #f5f5f5; }
</style>
</head>
<body>

<div class="header">
  <div class="header-emoji">🍋</div>
  <div>
    <div class="header-title" data-stand-name>Lemonade Stand</div>
    <div class="header-sub">Order Lookup</div>
  </div>
</div>

<div class="container">
  <div id="lookupView">
    <div class="card">
      <p class="section-label">Enter your order code</p>
      <input class="code-input" id="codeInput" type="text" placeholder="A1B2" maxlength="4" autocomplete="off" autocapitalize="characters" oninput="this.value=this.value.toUpperCase()">
      <button class="lookup-btn" id="lookupBtn" onclick="lookupCode()">Look up order</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <div id="loadingView">
    <div class="card loading-card">
      <div class="spinner"></div>
      <p>Finding your order...</p>
    </div>
  </div>

  <div id="orderView">
    <div class="card">
      <p class="section-label">Your order</p>
      <div id="orderLines"></div>
      <div class="order-total-row">
        <span>Total</span>
        <span id="orderTotal"></span>
      </div>
      <div class="payment-banner" id="paymentBanner"></div>
      <div id="payBtnWrap"></div>
    </div>
  </div>

  <div id="tipView">
    <div class="card">
      <div class="tip-header">Add a tip? 🍋</div>
      <div class="tip-sub">100% goes to the stand</div>
      <div class="tip-presets" id="tipPresets">
        <div class="tip-preset" onclick="selectCustomerTip(this, 0)">
          <div class="tip-pct">No tip</div>
          <div class="tip-amt">&nbsp;</div>
        </div>
        <div class="tip-preset" onclick="selectCustomerTip(this, 10)">
          <div class="tip-pct">10%</div>
          <div class="tip-amt" id="tip10amt"></div>
        </div>
        <div class="tip-preset" onclick="selectCustomerTip(this, 15)">
          <div class="tip-pct">15%</div>
          <div class="tip-amt" id="tip15amt"></div>
        </div>
        <div class="tip-preset" onclick="selectCustomerTip(this, 20)">
          <div class="tip-pct">20%</div>
          <div class="tip-amt" id="tip20amt"></div>
        </div>
      </div>
      <div class="tip-custom-row">
        <span class="tip-lbl">Custom $</span>
        <input class="tip-custom-input" id="customerTipCustom" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" oninput="onCustomerCustomTip()">
      </div>
      <div class="tip-total-row">
        <span>Total with tip</span>
        <span id="tipGrandTotal"></span>
      </div>
      <button class="tip-pay-btn" id="tipPayBtn" onclick="proceedToPay()">Open Venmo — <span id="tipPayAmt"></span></button>
      <button class="tip-skip" onclick="skipTip()">No thanks, skip tip</button>
    </div>
  </div>

  <div id="successView">
    <div class="card">
      <div class="success-box">
        <div class="success-big" id="successEmoji">🍋</div>
        <h2 id="successTitle">All set!</h2>
        <p id="successMsg">Enjoy your lemonade!</p>
        <button class="another-btn" onclick="resetCustomer()">Start over</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ==== STAND CONFIG (the only part to edit per customer) ====
  const STAND_NAME = 'Lemonade Stand';
  const VENMO_USERNAME = 'Christian_Schrader'; // without the @
  const firebaseConfig = {
    apiKey: "AIzaSyBv5S44GU9ESCv-gypE7ujawsz5Je0935U",
    authDomain: "lemonade-10d16.firebaseapp.com",
    projectId: "lemonade-10d16",
    storageBucket: "lemonade-10d16.firebasestorage.app",
    messagingSenderId: "190999159050",
    appId: "1:190999159050:web:894ae02547b1e59fd59af3"
  };
  // ==== END STAND CONFIG ====

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = (n) => '$' + Number(n || 0).toFixed(2);

  document.title = `${STAND_NAME} — Order Lookup`;
  document.querySelectorAll('[data-stand-name]').forEach(el => el.textContent = STAND_NAME);

  let currentCode = null;
  let currentOrder = null;
  let customerTip = 0;

  const views = ['lookupView', 'loadingView', 'orderView', 'tipView', 'successView'];
  function show(id) { views.forEach(v => document.getElementById(v).style.display = v === id ? 'block' : 'none'); }

  // What the order costs before the customer's own tip (includes any tip added at the register)
  const orderTotal = () => Number(currentOrder.total ?? currentOrder.subtotal ?? 0);
  // Customer tip percentages are based on the items only
  const orderSubtotal = () => Number(currentOrder.subtotal ?? currentOrder.total ?? 0);
  const registerTip = () => Number(currentOrder.tip || 0);

  function lookupError(msg) {
    const errEl = document.getElementById('errorMsg');
    const btn = document.getElementById('lookupBtn');
    errEl.textContent = msg; errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Look up order';
    show('lookupView');
  }

  window.lookupCode = async () => {
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    const errEl = document.getElementById('errorMsg');
    const btn = document.getElementById('lookupBtn');
    if (code.length < 4) { lookupError('Please enter a 4-character code.'); return; }
    btn.disabled = true; btn.textContent = 'Looking up...'; errEl.style.display = 'none';
    show('loadingView');
    try {
      const snap = await getDoc(doc(db, 'orders', code));
      if (!snap.exists()) { lookupError('Code not found — double-check with the cashier.'); return; }
      currentCode = code; currentOrder = snap.data();

      if (currentOrder.status === 'paid' && !currentOrder.cashPaid) {
        showSuccess('✅', 'Already paid!', 'This order has already been paid. Enjoy your lemonade! 🍋');
        return;
      }

      let linesHtml = '';
      Object.values(currentOrder.items || {}).forEach(item => {
        linesHtml += `<div class="order-row"><span>${esc(item.emoji)} ${esc(item.name)} ×${esc(item.qty)}</span><span>${money(item.price * item.qty)}</span></div>`;
      });
      if (registerTip() > 0) linesHtml += `<div class="order-row"><span>Tip</span><span>${money(registerTip())}</span></div>`;
      document.getElementById('orderLines').innerHTML = linesHtml;
      document.getElementById('orderTotal').textContent = money(orderTotal());

      const banner = document.getElementById('paymentBanner');
      const btnWrap = document.getElementById('payBtnWrap');

      if (currentOrder.cashPaid) {
        banner.className = 'payment-banner banner-cash';
        banner.textContent = '✅ Cash already paid — you\'re all set!';
        btnWrap.innerHTML = '';
      } else if (currentOrder.payment === 'venmo') {
        banner.className = 'payment-banner banner-venmo';
        banner.textContent = '💙 Pay with Venmo';
        if (registerTip() > 0) {
          // Tip was already added at the register, so don't ask again
          btnWrap.innerHTML = `<button class="pay-btn pay-btn-venmo" onclick="window.payNoExtraTip()">Open Venmo — ${money(orderTotal())}</button>`;
        } else {
          btnWrap.innerHTML = `<button class="pay-btn pay-btn-venmo" onclick="window.goToTip()">Continue to pay →</button>`;
        }
      } else {
        banner.className = 'payment-banner banner-other';
        banner.textContent = 'Please ask the cashier how to pay for this order.';
        btnWrap.innerHTML = '';
      }

      show('orderView');
      btn.disabled = false; btn.textContent = 'Look up order';
    } catch (e) {
      console.error(e);
      lookupError('Something went wrong. Check your connection and try again.');
    }
  };

  window.goToTip = () => {
    customerTip = 0;
    document.querySelectorAll('.tip-preset').forEach(p => p.classList.remove('selected'));
    document.getElementById('customerTipCustom').value = '';
    const sub = orderSubtotal();
    document.getElementById('tip10amt').textContent = money(sub * 0.10);
    document.getElementById('tip15amt').textContent = money(sub * 0.15);
    document.getElementById('tip20amt').textContent = money(sub * 0.20);
    updateTipTotal();
    show('tipView');
  };

  window.selectCustomerTip = (el, pct) => {
    document.querySelectorAll('.tip-preset').forEach(p => p.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('customerTipCustom').value = '';
    customerTip = pct === 0 ? 0 : parseFloat((orderSubtotal() * pct / 100).toFixed(2));
    updateTipTotal();
  };

  window.onCustomerCustomTip = () => {
    document.querySelectorAll('.tip-preset').forEach(p => p.classList.remove('selected'));
    const v = parseFloat(document.getElementById('customerTipCustom').value);
    customerTip = isNaN(v) || v < 0 ? 0 : parseFloat(v.toFixed(2));
    updateTipTotal();
  };

  function updateTipTotal() {
    const grand = money(orderTotal() + customerTip);
    document.getElementById('tipGrandTotal').textContent = grand;
    document.getElementById('tipPayAmt').textContent = grand;
  }

  // Record what the customer is about to pay, then send them to Venmo.
  // The order stays unpaid ('venmo_opened') until the cashier taps "Mark as paid".
  async function openVenmo(tip) {
    const grand = parseFloat((orderTotal() + tip).toFixed(2));
    try {
      await updateDoc(doc(db, 'orders', currentCode), { status: 'venmo_opened', customerTip: tip, grandTotal: grand, venmoOpenedAt: new Date() });
    } catch (e) { console.error(e); }
    showSuccess('💙', 'Venmo opened!', `Please finish paying ${money(grand)} in the Venmo app, then show the cashier. Enjoy your lemonade! 🍋`);
    const note = encodeURIComponent(`${STAND_NAME} Order ${currentCode}`);
    window.location.href = `https://venmo.com/${encodeURIComponent(VENMO_USERNAME)}?txn=pay&amount=${grand.toFixed(2)}&note=${note}`;
  }

  window.proceedToPay = () => openVenmo(customerTip);
  window.skipTip = () => openVenmo(0);
  window.payNoExtraTip = () => openVenmo(0);

  function showSuccess(emoji, title, msg) {
    document.getElementById('successEmoji').textContent = emoji;
    document.getElementById('successTitle').textContent = title;
    document.getElementById('successMsg').textContent = msg;
    show('successView');
  }

  window.resetCustomer = () => {
    currentCode = null; currentOrder = null; customerTip = 0;
    document.getElementById('codeInput').value = '';
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('lookupBtn').disabled = false;
    document.getElementById('lookupBtn').textContent = 'Look up order';
    show('lookupView');
    history.replaceState(null, '', location.pathname);
  };

  document.getElementById('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') window.lookupCode(); });

  // Auto-load if ?code= is in the URL (from QR scan)
  const urlCode = new URLSearchParams(window.location.search).get('code');
  if (urlCode && urlCode.length === 4) {
    document.getElementById('codeInput').value = urlCode.toUpperCase();
    window.lookupCode();
  }
</script>
</body>
</html>
